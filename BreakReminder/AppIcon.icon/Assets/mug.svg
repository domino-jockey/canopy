<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Shapes shared with Assets.xcassets/MenuBarIcon.imageset/menubar-mug.svg: change both together. -->
  <defs>
    <!-- Mocha mauve → pink → peach, top-left to bottom-right -->
    <linearGradient id="mocha" x1="300" y1="330" x2="800" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CBA6F7"/>
      <stop offset="0.5" stop-color="#F5C2E7"/>
      <stop offset="1" stop-color="#FAB387"/>
    </linearGradient>
  </defs>
  <g transform="translate(-40 0)">
    <!-- Handle -->
    <path d="M660 410 H700 Q780 410 780 490 V550 Q780 630 700 630 H660" fill="none" stroke="url(#mocha)" stroke-width="48"/>
    <!-- Body -->
    <path d="M300 350 Q300 330 320 330 H640 Q660 330 660 350 V640 Q660 720 580 720 H380 Q300 720 300 640 Z" fill="url(#mocha)"/>
