name: Canopy

options:
  bundleIdPrefix: com.jammyjellyfish
  deploymentTarget:
    macOS: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-" # "Sign to Run Locally": no Apple account needed

packages:
  KeyboardShortcuts: # global shortcut recorder (MIT)
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0

targets:
  Canopy:
    type: application
    platform: macOS
    sources: [Canopy]
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jammyjellyfish.BreakReminder # the app's old name, kept so settings, stats and the login item carry over
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES # menu bar only: no Dock icon
        INFOPLIST_FILE: Canopy/App/Info.plist # extra keys, merged into the generated one
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor # leaf green; used when the system accent is Multicolor
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: [CanopyTests]

  CanopyTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CanopyTests]
    dependencies:
      - target: Canopy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
